showpw(b){const i=$('#lpw')||$('#rw');if(i)i.type=b.checked?'text':'password'},
hw(b){go({n:'hw',cid:b.dataset.id,g:V.g,p:V.p})},
pickg(b){V.g=+b.dataset.v;V.p=null;render()},
pickp(b){V.p=b.dataset.v;render()},
upg(){V.g=null;V.p=null;render()},
upp(){V.p=null;render()},
async sendhw(){const t=$('#ht').value.trim(),img=await shrink($('#hi').files[0]);if(!t&&!img)return $('#msg').textContent='اكتب إجابتك أو ارفع صورة';db.hw.push({id:'h'+Date.now(),sid:me().id,cid:V.cid,txt:t,img,at:Date.now(),rep:'',done:false});save();render()},
grade(b){const h=db.hw.find(x=>x.id==b.dataset.id);if(!h)return;h.rep=$('#r'+h.id).value.trim();const sc=$('#s'+h.id);if(sc)h.sc=sc.value.trim();h.done=true;save();render()},
addto(b){const s=db.students.find(x=>x.id==b.dataset.id),c=$('#sc'+b.dataset.id).value;if(!s||!c)return;s.owned=s.owned||[];if(!s.owned.includes(c))s.owned.push(c);save();b.textContent='تمت ✓'},
manual(){const c=$('#kc').value,s=db.students.find(x=>x.id==$('#ks').value);if(!c||!s)return;s.owned=s.owned||[];if(!s.owned.includes(c))s.owned.push(c);save();$('#msg').style.color='var(--grn)';$('#msg').textContent='تمت إضافة '+s.name+' للدورة'}
};
document.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.c;if(f&&A[f])A[f](e.target)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b)});
try{const t=localStorage.getItem('sk4t');if(t)document.documentElement.dataset.theme=t}catch(e){}
if(fs){app.innerHTML='<div class=card style="text-align:center"><h2>⏳ جاري التحميل...</h2></div>';startSync()}else render();
</script>
</body>
</html>
